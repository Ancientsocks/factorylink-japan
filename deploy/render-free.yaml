databases:
  - name: factorylink-db
    plan: free
    databaseName: factorylink
    user: factorylink

services:
  - type: web
    name: factorylink-ancientsocks-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: ENVIRONMENT
        value: development
      - key: AUTO_CREATE_SCHEMA
        value: "true"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: factorylink-db
          property: connectionString
