# FactoryLink single Render Blueprint.
# Create the managed Postgres instance manually first with the exact settings below,
# save its initial owner Internal Database URL, then create factorylink_app as the
# new default credential. Sync this Blueprint once; it adopts the same-named DB
# and manages the database plus all application resources together.
# This provisions paid Singapore-region services; review plan/costs before sync.
# Secrets prompted with sync:false are entered in the Render Dashboard.
previews:
  generation: off

databases:
  - name: factorylink-postgres
    databaseName: factorylink
    user: factorylink_owner
    region: singapore
    postgresMajorVersion: "17"
    plan: 0.5c-1g
    diskSizeGB: 15
    ipAllowList: []

envVarGroups:
  - name: factorylink-production-shared
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_MINUTES
        value: "20"
      - key: REFRESH_TOKEN_DAYS
        value: "14"
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: SEED_DEMO_DATA
        value: "false"
      - key: ALLOW_PUBLIC_REGISTRATION
        value: "false"
      - key: EXPOSE_AUTH_ACTION_LINKS
        value: "false"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_FAIL_CLOSED
        value: "true"
      - key: API_RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: AUTH_RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: REGISTRATION_RATE_LIMIT_PER_MINUTE
        value: "5"
      - key: PASSWORD_RESET_RATE_LIMIT_PER_MINUTE
        value: "3"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_STARTTLS
        value: "true"
      - key: STORAGE_PROVIDER
        value: s3
      - key: MALWARE_SCAN_ENABLED
        value: "true"
      - key: MALWARE_SCANNER_PORT
        value: "3310"
      - key: MALWARE_SCANNER_TIMEOUT_SECONDS
        value: "30"
      - key: STORAGE_S3_REGION
        value: ap-northeast-1
      - key: LOG_LEVEL
        value: INFO
      - key: PORT
        value: "10000"

services:
  - type: keyvalue
    name: factorylink-redis
    region: singapore
    plan: 1g
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

  # ClamAV is private-only. Its persistent disk keeps signatures across deploys.
  - type: pserv
    name: factorylink-clamav
    runtime: docker
    region: singapore
    plan: 2c-4g
    dockerfilePath: scanner/Dockerfile
    dockerContext: .
    disk:
      name: factorylink-clamav-signatures
      mountPath: /var/lib/clamav
      sizeGB: 5
    maxShutdownDelaySeconds: 60
    autoDeployTrigger: checksPass

  - type: pserv
    name: factorylink-api
    runtime: python
    region: singapore
    plan: 1c-2g
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m app.render_deploy prepare
    startCommand: python -m app.render_deploy api
    maxShutdownDelaySeconds: 90
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: factorylink-production-shared
      # Save the original owner connection URL before creating the managed
      # runtime credential; the owner URL is supplied as a one-time secret.
      - key: OWNER_DATABASE_URL
        sync: false
      # Render-managed default credential for factorylink_app. It is created
      # in the database Credentials panel and auto-updates on credential rotation.
      - key: RUNTIME_DATABASE_URL
        fromDatabase:
          name: factorylink-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: factorylink-redis
          type: keyvalue
          property: connectionString
      - key: FRONTEND_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: STORAGE_S3_BUCKET
        sync: false
      - key: STORAGE_S3_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_S3_SECRET_ACCESS_KEY
        sync: false
      # Private address of a separately provisioned ClamAV service (TCP 3310).
      - key: MALWARE_SCANNER_HOST
        fromService:
          name: factorylink-clamav
          type: pserv
          property: host

  - type: worker
    name: factorylink-worker
    runtime: python
    region: singapore
    plan: 0.5c-512mb
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.render_deploy worker
    maxShutdownDelaySeconds: 120
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: factorylink-production-shared
      - key: RUNTIME_DATABASE_URL
        fromDatabase:
          name: factorylink-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: factorylink-redis
          type: keyvalue
          property: connectionString
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: worker
    name: factorylink-scheduler
    runtime: python
    region: singapore
    plan: 0.5c-512mb
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.render_deploy scheduler
    maxShutdownDelaySeconds: 60
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: factorylink-production-shared
      - key: RUNTIME_DATABASE_URL
        fromDatabase:
          name: factorylink-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: factorylink-redis
          type: keyvalue
          property: connectionString

  - type: web
    name: factorylink-web
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: frontend/Dockerfile
    dockerContext: frontend
    healthCheckPath: /health/live
    autoDeployTrigger: checksPass
    envVars:
      - key: BACKEND_HOST
        fromService:
          name: factorylink-api
          type: pserv
          property: hostport
